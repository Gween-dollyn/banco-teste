<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="'UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="card">
        <h1>Meu perfil</h1>
        <p class = "subtitle">Membro desde <span id="user-created">...</span></p>

        <form id="profile-form">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Salvar alterações</button>
            <p id="profile-message" class="message" role="alert"></p>
        </form>

        <hr class="divider">

        <form id="password-form">
            <h2>Alterar senha</h2>

            <label for="currentPassword">Senha atual</label>
            <input type="password" id="currentPassword" name="currentPassword" required>

            <label for="newPassword">Nova senha</label>
            <input type="password" id="newPassword" name="newPassword" minlength="8" required>

            <label for="confirm">Confirmar nova senha</label>
            <input type="password" id="confirm" name="confirm" required>

            <button type="submit">Alterar senha</button>
            <p id="password-message" class="message" role="alert"></p>
        </form>

        <hr class="divider">

        <button id="logout" class="secondary">Sair</button>
    </main>

    <script src="/js/profile.js"></script>
</body>
</html>
